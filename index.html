<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Web Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>JARVIS</h1>

        <div id="chat">
            <div class="jarvis">
                Hola Junior. Soy JARVIS. ¿En qué puedo ayudarte?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe un comando...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
